<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mountain guiding, landscapes and adventures with [GUIDE NAME].">
  <title>Gallery | [GUIDE NAME]</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header gallery-header">
    <a class="wordmark" href="index.html">[GUIDE NAME]<span>Mountain Guide</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html#about">About</a>
      <a href="index.html#expertise">Expertise</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
    </nav>
  </header>
  <main>
    <section class="gallery-hero">
      <p class="eyebrow">FIELD NOTES IN PICTURES</p>
      <h1>A life lived<br><em>outside.</em></h1>
      <p>Mountain days, remarkable landscapes and the moments in between.</p>
    </section>
    <section class="gallery-grid section-wrap" aria-label="Photo gallery">
      <!-- Add your photos to the images folder and replace each placeholder filename below. -->
      <figure class="gallery-item gallery-tall">
        <img src="images/mountain-01.jpg" alt="Mountain landscape" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="image-placeholder"><span>01</span><strong>Add a mountain photo</strong><small>images/mountain-01.jpg</small></div>
        <figcaption><span>01</span> High places, wide horizons</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/mountain-02.jpg" alt="Mountain guide on a trail" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="image-placeholder"><span>02</span><strong>Add a guiding photo</strong><small>images/mountain-02.jpg</small></div>
        <figcaption><span>02</span> The journey matters</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/mountain-03.jpg" alt="Mountain peaks at sunrise" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="image-placeholder"><span>03</span><strong>Add a sunrise photo</strong><small>images/mountain-03.jpg</small></div>
        <figcaption><span>03</span> Early starts, lasting memories</figcaption>
      </figure>
      <figure class="gallery-item gallery-wide">
        <img src="images/mountain-04.jpg" alt="Wide mountain panorama" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="image-placeholder"><span>04</span><strong>Add a panorama</strong><small>images/mountain-04.jpg</small></div>
        <figcaption><span>04</span> Room to breathe</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/mountain-05.jpg" alt="Outdoor adventure" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="image-placeholder"><span>05</span><strong>Add an adventure photo</strong><small>images/mountain-05.jpg</small></div>
        <figcaption><span>05</span> Out there together</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="images/mountain-06.jpg" alt="Mountain trail" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="image-placeholder"><span>06</span><strong>Add a trail photo</strong><small>images/mountain-06.jpg</small></div>
        <figcaption><span>06</span> One step at a time</figcaption>
      </figure>
    </section>
  </main>
  <footer class="site-footer">
    <a class="wordmark footer-wordmark" href="index.html">[GUIDE NAME]<span>Mountain Guide</span></a>
    <p>Made for the love of wild places.</p>
    <a href="index.html">Back to home ↗</a>
  </footer>
</body>
</html>
